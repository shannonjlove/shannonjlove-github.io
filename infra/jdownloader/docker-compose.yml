services:
  jdownloader-2:
    image: lscr.io/linuxserver/jdownloader-2:latest
    container_name: jdownloader-2
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      # Set these to connect to your MyJDownloader account:
      - MYJDOWNLOADER_EMAIL=${MYJDOWNLOADER_EMAIL}
      - MYJDOWNLOADER_PASSWORD=${MYJDOWNLOADER_PASSWORD}
      # Friendly name shown in the MyJDownloader app:
      - MYJDOWNLOADER_DEVICE_NAME=${MYJDOWNLOADER_DEVICE_NAME:-SJL-WebTop}
    volumes:
      - /opt/jdownloader/config:/config
      - /opt/jdownloader/downloads:/downloads
    ports:
      # JDownloader web UI (optional, accessible via browser)
      - "5800:5800"
      # MyJDownloader remote port
      - "3129:3129"
    restart: unless-stopped
    network_mode: bridge
