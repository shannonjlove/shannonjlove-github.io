# FileWarden rules — Cloud Import Pipeline
# Append to /opt/filewarden/config.yaml (or include via config merge)
#
# Architecture:
#   Dropbox/pCloud → rclone sync → /data/inbox/{dropbox,pcloud}/
#   Stage 1: Log cloud origin  (stop_processing: false — inbox rules continue)
#   Stage 2: Existing inbox rules → sjl_rename + PARA routing → /data/{projects,areas,resources,archive}/
#   Stage 3: tag-and-analyze.sh — exhaustive metadata + write-back (fires on PARA dirs)
#   Stage 4: upload-to-idrive-s3.sh — upload file + all sidecars to iDrive E2
#
# Tagging produces per-file sidecars (.meta.json .ffprobe.json .acoustid.json .ocr.txt)
# that travel with the file to S3 and persist for downstream software.
#
# Requires:
#   /opt/filewarden/scripts/tag-and-analyze.sh
#   /opt/filewarden/scripts/upload-to-idrive-s3.sh
#   rclone remote "idrive" configured on VPS
#   bash /opt/filewarden/scripts/install-tagging-deps.sh  (run once)

# ── Stage 1: Inbox ingestion ──────────────────────────────────────────────────
# Log cloud origin; stop_processing: false so existing inbox rules (sjl_rename +
# PARA routing) continue to fire afterward.

- name: "Cloud Ingest — tag Dropbox origin"
  enabled: true
  match: all
  conditions:
    - attribute: path
      operator: starts_with
      value: /data/inbox/dropbox
    - attribute: full_name
      operator: does_not_contain
      value: .tmp
    - attribute: full_name
      operator: does_not_contain
      value: .part
  actions:
    - type: log
      params:
        message: "Cloud ingest [dropbox]: {full_name}"
  stop_processing: false

- name: "Cloud Ingest — tag pCloud origin"
  enabled: true
  match: all
  conditions:
    - attribute: path
      operator: starts_with
      value: /data/inbox/pcloud
    - attribute: full_name
      operator: does_not_contain
      value: .tmp
    - attribute: full_name
      operator: does_not_contain
      value: .part
  actions:
    - type: log
      params:
        message: "Cloud ingest [pcloud]: {full_name}"
  stop_processing: false

# ── Stage 3 + 4: Tag → Upload (fires on every PARA destination) ──────────────
# Runs AFTER inbox rules have routed and renamed the file.
# tag-and-analyze.sh runs first (produces sidecars + writes tags back to file),
# then upload-to-idrive-s3.sh uploads file + all sidecars to the correct bucket.

- name: "Tag + Upload — /data/resources"
  enabled: true
  match: all
  conditions:
    - attribute: path
      operator: starts_with
      value: /data/resources
    - attribute: full_name
      operator: does_not_contain
      value: .tmp
    - attribute: full_name
      operator: does_not_contain
      value: .meta.json
    - attribute: full_name
      operator: does_not_contain
      value: .ffprobe.json
    - attribute: full_name
      operator: does_not_contain
      value: .acoustid.json
    - attribute: full_name
      operator: does_not_contain
      value: .ocr.txt
  actions:
    - type: run_script
      params:
        script: bash /opt/filewarden/scripts/tag-and-analyze.sh "$FW_FILE"
    - type: run_script
      params:
        script: bash /opt/filewarden/scripts/upload-to-idrive-s3.sh "$FW_FILE" resources
    - type: log
      params:
        message: "Tagged + uploaded [resources]: {full_name}"
  stop_processing: true

- name: "Tag + Upload — /data/areas"
  enabled: true
  match: all
